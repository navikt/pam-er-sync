name: deploy-prod
on:
  release:
    types: [published]

jobs:
  call-workflow:
    if: ${{ !contains(github.event.release.tag_name, '/') }}
    uses: navikt/pam-deploy/.github/workflows/deploy-prod.yml@v9
    permissions:
      contents: write
      id-token: write
    with:
      NAIS_RESOURCE: naiserator.yml
