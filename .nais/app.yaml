apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: pam-er-sync
  namespace: teampam
  labels:
    team: teampam
spec:
  port: 9012
  startup:
    path: /isAlive
    initialDelay: 0
    periodSeconds: 1
    failureThreshold: 60
  liveness:
    path: /isAlive
    initialDelay: 0
  readiness:
    path: /isReady
    initialDelay: 0
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1536Mi
  prometheus:
    enabled: true
    path: /actuator/prometheus
  observability:
    logging:
      destinations:
        - id: loki
        - id: elastic
  openSearch:
    access: admin
    instance: enhetsregisteret
  accessPolicy:
    outbound:
      external:
        - host: data.brreg.no
          ports:
            - port: 443
